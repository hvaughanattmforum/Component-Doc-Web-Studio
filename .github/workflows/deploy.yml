name: Deploy to ECS Express Mode

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC federation to AWS - no static keys stored in this repo
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --provenance=false --sbom=false \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Deploy to ECS Express Mode
        run: |
          # `aws ecs wait services-stable` expects the service to settle back
          # down to exactly one deployment/service-revision - but Express
          # Mode's blue/green model deliberately keeps the previous revision
          # listed (at requestedTaskCount 0) for instant rollback rather than
          # removing it, so that condition never becomes true and the waiter
          # always eventually times out ("Max attempts exceeded") even once
          # the new revision is genuinely healthy and already serving traffic.
          #
          # A first replacement (counting "the currently-active revision has
          # caught up to its own requested count") was itself wrong: right
          # after force-new-deployment returns, the OLD deployment is still
          # the only one with requestedTaskCount > 0 (it hasn't been scaled
          # to 0 yet) and is already stable from before this run even
          # started - so that check passed instantly on iteration 1, before
          # the NEW deployment had done anything, confirmed by
          # PR #27's run (33644218836): it exited in ~1.5s reporting
          # requested=1 running=1 pending=0 for deployment
          # ecs-svc/2539439739407835678 (the pre-existing one, rolloutState
          # already COMPLETED beforehand), while the real new deployment
          # ecs-svc/2521429614593444404 sat at desiredCount 0, rolloutState
          # IN_PROGRESS, in that same update-service response - i.e. it
          # declared success without the new revision doing anything, and
          # the site kept serving the old build.
          #
          # Correct fix: `update-service` names its own new deployment in
          # its response (status PRIMARY) - track that exact deployment id
          # and poll until ITS rolloutState reaches COMPLETED. No ambiguity
          # about which deployment is "active" during the swap window.
          UPDATE_OUTPUT=$(aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment \
            --output json)

          DEPLOYMENT_ID=$(echo "$UPDATE_OUTPUT" | jq -r '.service.deployments[] | select(.status=="PRIMARY") | .id')
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::Could not find the new PRIMARY deployment id in the update-service response."
            exit 1
          fi
          echo "Waiting for deployment $DEPLOYMENT_ID to complete..."

          # Same 40x15s=10min budget the original waiter used, so a
          # genuinely stuck deployment still fails in the same timeframe.
          for i in $(seq 1 40); do
            DEPLOYMENT=$(aws ecs describe-services \
              --cluster "${{ vars.ECS_CLUSTER }}" \
              --services "${{ vars.ECS_SERVICE }}" \
              --output json | jq -c --arg id "$DEPLOYMENT_ID" '.services[0].deployments[] | select(.id == $id)')
            ROLLOUT=$(echo "$DEPLOYMENT" | jq -r '.rolloutState // "UNKNOWN"')
            REASON=$(echo "$DEPLOYMENT" | jq -r '.rolloutStateReason // "no reason given"')
            echo "rolloutState=$ROLLOUT ($REASON)"
            if [ "$ROLLOUT" = "COMPLETED" ]; then
              echo "Deployment is stable."
              exit 0
            fi
            if [ "$ROLLOUT" = "FAILED" ]; then
              echo "::error::Deployment $DEPLOYMENT_ID failed: $REASON"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Deployment $DEPLOYMENT_ID never completed within 10 minutes."
          exit 1

      - name: Re-point custom domain rule to the now-active target group
        if: vars.ALB_LISTENER_ARN != '' && vars.CUSTOM_DOMAIN_LISTENER_RULE_ARN != ''
        run: |
          # Express Mode blue/green-swaps between 2 target groups on every
          # deployment. Its own auto-managed rule (for the *.ecs.<region>.on.aws
          # hostname) always has the correct weights (100 = active, 0 =
          # draining) - mirror that instead of guessing which one is live.
          # Using jq rather than --query/JMESPath here - a JMESPath
          # projection chain (Rules[?...].Actions[0]...) does NOT flatten
          # the way you'd expect (each filtered rule's .Actions becomes its
          # own nested list), silently returning nothing instead of erroring,
          # which is exactly what broke this step's first attempt.
          ACTIVE_TG=$(aws elbv2 describe-rules --listener-arn "${{ vars.ALB_LISTENER_ARN }}" --output json | \
            jq -r '.Rules[] | select((.Conditions[0].HostHeaderConfig.Values[0] // "") | contains("on.aws")) | .Actions[0].ForwardConfig.TargetGroups[] | select(.Weight==100) | .TargetGroupArn')
          if [ -z "$ACTIVE_TG" ]; then
            echo "Could not determine the active target group - leaving the custom domain rule untouched." >&2
            exit 1
          fi
          aws elbv2 modify-rule --rule-arn "${{ vars.CUSTOM_DOMAIN_LISTENER_RULE_ARN }}" \
            --actions Type=forward,TargetGroupArn="$ACTIVE_TG"
